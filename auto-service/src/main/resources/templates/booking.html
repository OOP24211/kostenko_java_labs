<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на услугу - Автосервис</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-car me-2"></i>Razval</a>
        <a class="btn btn-outline-light btn-sm" sec:authorize="isAuthenticated()" href="/profile">
            Назад в профиль
        </a>    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-calendar-alt me-2"></i>Запись на услугу</h4>
                </div>
                <div class="card-body">

                    <div class="alert alert-info">
                        <strong>Выбранная услуга:</strong>
                        <span th:text="${selectedService}"></span> -
                        <span th:text="${selectedPrice} + ' ₽'"></span>
                    </div>

                    <form method="post" action="/booking">

                        <div class="mb-3">
                            <label class="form-label">Ваш автомобиль</label>
                            <select name="carId" class="form-select" required>
                                <option th:each="car : ${cars}" th:value="${car.id}"
                                        th:text="${car.brand} + ' ' + ${car.model} + ' (' + ${car.year} + ')'">
                                </option>
                            </select>
                        </div>

                        <input type="hidden" name="serviceName" th:value="${selectedService}">
                        <input type="hidden" name="price" th:value="${selectedPrice}">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Дата</label>
                                <input type="date" name="date" class="form-control"
                                       th:min="${today}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Время</label>
                                <select name="time" class="form-select" required>
                                    <option th:each="slot : ${timeSlots}" th:value="${slot}"
                                            th:text="${slot}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Комментарий (необязательно)</label>
                            <textarea name="comment" class="form-control" rows="3"
                                      placeholder="Опишите проблему или особые пожелания..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-check me-2"></i>Подтвердить запись
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
