<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Автосервис</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .register-card {
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .register-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .register-body {
            padding: 40px;
        }
        .btn-register {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border: none;
            padding: 12px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .btn-register:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body class="d-flex align-items-center">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card register-card">
                <div class="register-header">
                    <i class="fas fa-user-plus fa-3x mb-3"></i>
                    <h3>Регистрация</h3>
                    <p class="mb-0">Создайте аккаунт для записи в автосервис</p>
                </div>
                <div class="register-body">

                    <!-- сообщение об ошибке -->
                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <!-- форма регистрации -->
                    <form method="post" action="/register" th:action="@{/register}">

                        <div class="mb-3">
                            <label class="form-label">Имя пользователя *</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" name="username" class="form-control"
                                       placeholder="ivan123" required>
                            </div>
                            <small class="text-muted">Только латиница и цифры</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email *</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" name="email" class="form-control"
                                       placeholder="ivan@mail.ru" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Пароль *</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" name="password" class="form-control"
                                       placeholder="минимум 6 символов" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Полное имя (необязательно)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                                <input type="text" name="fullName" class="form-control"
                                       placeholder="Иван Иванов">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Телефон (необязательно)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                <input type="tel" name="phone" class="form-control"
                                       placeholder="+7 (999) 123-45-67">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 btn-register">
                            <i class="fas fa-user-plus me-2"></i>Зарегистрироваться
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-0">Уже есть аккаунт?
                            <a href="/login" class="text-decoration-none">Войти</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
